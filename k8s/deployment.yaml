apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  replicas: 3

  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx

    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine

        ports:
        - containerPort: 80

        volumeMounts:
        - name: nginx-content
          mountPath: /usr/share/nginx/html

      volumes:
      - name: nginx-content
        configMap:
          name: nginx-content
